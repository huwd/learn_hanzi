name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify required repo variables
        env:
          CLOUDFLARE_TEAM: ${{ vars.CLOUDFLARE_TEAM }}
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_TEAM" ]; then
            echo "::error::CLOUDFLARE_TEAM repository variable is not set" >&2
            missing=1
          fi
          if [ -z "$REGISTRY" ]; then
            echo "::error::REGISTRY repository variable is not set" >&2
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Enroll runner in Cloudflare One via WARP
        uses: Boostport/setup-cloudflare-warp@2557ba84f68223c4642f8d65d1c7371666c5af34 # v1.18.0
        with:
          organization: ${{ vars.CLOUDFLARE_TEAM }}
          auth_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Log in to private registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ vars.REGISTRY }}/learn_hanzi
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Read Ruby version
        id: ruby
        run: echo "version=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RUBY_VERSION=${{ steps.ruby.outputs.version }}
