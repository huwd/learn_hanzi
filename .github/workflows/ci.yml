name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUNDLE_WITHOUT: development

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: |
          set +e
          bin/brakeman --no-pager
          brakeman_exit=$?
          set -e
          # Exit code 5 means brakeman is outdated — not a security issue, don't fail CI.
          # All other non-zero exit codes indicate real warnings or errors.
          if [ $brakeman_exit -ne 0 ] && [ $brakeman_exit -ne 5 ]; then exit $brakeman_exit; fi

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y curl libjemalloc2 sqlite3

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build assets
        run: bin/rails tailwindcss:build

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare && bundle exec rspec

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  # Exercises the real omniauth_openid_connect strategy (discovery, JWKS,
  # redirect_uri, authorization-code + PKCE exchange) against a stub OIDC
  # server, rather than the OmniAuth test-mode mock every other spec uses.
  # See docs/testing/real_oidc_stub.md.
  #
  # The oidc-server plugin's issuer bug that used to make this job fail
  # against the standard published plugin (discovery document and issued ID
  # tokens omitting path_prefix from their issuer) was fixed upstream in
  # imposter-go v5.19.2 — see docs/testing/real_oidc_stub.md. bin/oidc_stub
  # and bin/oidc_stub_setup now pin to that fixed version, so this job is
  # expected to pass. Still not in `publish`'s needs: below and still
  # continue-on-error, pending a run or two of track record on this new pin
  # before promoting it to a required, blocking check.
  real_oidc_test:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y curl libjemalloc2 sqlite3

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build assets
        run: bin/rails tailwindcss:build

      - name: Install Imposter CLI and oidc-server plugin
        run: bin/oidc_stub_setup

      - name: Start OIDC stub
        run: |
          bin/oidc_stub &
          timeout 30 bash -c 'until curl -sf http://localhost:8080/oidc/.well-known/openid-configuration; do sleep 1; done'

      - name: Run real-OIDC specs
        env:
          RAILS_ENV: test
          REAL_OIDC: "1"
          OIDC_ISSUER: "http://localhost:8080/oidc"
          OIDC_CLIENT_ID: "dev-client-id"
          OIDC_CLIENT_SECRET: "dev-client-secret"
          OIDC_REDIRECT_URI: "http://localhost:31337/auth/oidc/callback"
        run: bin/rails db:test:prepare && bundle exec rspec --tag real_oidc

      # This job has a history of intermittent Capybara ElementNotFound
      # failures that don't reproduce locally (see spec/system/real_oidc_login_spec.rb
      # git blame) — the failure screenshot RSpec/Capybara already saves to
      # tmp/capybara/ was previously lost with the ephemeral runner, leaving
      # nothing to diagnose the next occurrence from.
      - name: Upload Capybara failure screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: real-oidc-capybara-failures
          path: tmp/capybara/
          if-no-files-found: ignore

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v3
        with:
          languages: ruby

      - name: Autobuild
        uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v3

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scan_ruby, scan_js, lint, test, analyze]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Allow insecure registry over Tailscale
        run: |
          echo '{"insecure-registries": ["gismo:5000"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: gismo:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Generate CalVer tag
        id: calver
        run: |
          commit_date="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d "$GITHUB_SHA")"
          echo "tag=${commit_date}-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Read Ruby version
        id: ruby
        run: echo "version=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            gismo:5000/learn_hanzi:latest
            gismo:5000/learn_hanzi:${{ steps.calver.outputs.tag }}
          build-args: RUBY_VERSION=${{ steps.ruby.outputs.version }}

      - name: Redeploy on Portainer
        env:
          PORTAINER_ACCESS_KEY: ${{ secrets.PORTAINER_ACCESS_KEY }}
          PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import base64, json, urllib.request, os

          PORTAINER = "http://gismo:9000"
          STACK_ID = int(os.environ["PORTAINER_STACK_ID"])
          ENDPOINT_ID = 2

          key = os.environ["PORTAINER_ACCESS_KEY"]
          headers = {"X-API-Key": key, "Content-Type": "application/json"}

          # Pull via 127.0.0.1:5000 — already in the daemon's insecure CIDR,
          # avoids routing through Cloudflare entirely.
          reg_auth = base64.b64encode(json.dumps({
              "username": os.environ["REGISTRY_USERNAME"],
              "password": os.environ["REGISTRY_PASSWORD"],
              "serveraddress": "127.0.0.1:5000",
          }).encode()).decode()
          pull_req = urllib.request.Request(
              f"{PORTAINER}/api/endpoints/{ENDPOINT_ID}/docker/images/create"
              "?fromImage=127.0.0.1:5000/learn_hanzi&tag=latest",
              data=b"",
              headers={"X-API-Key": key, "X-Registry-Auth": reg_auth},
              method="POST",
          )
          with urllib.request.urlopen(pull_req, timeout=120) as resp:
              resp.read()
          print("Image pulled via 127.0.0.1:5000")

          # Fetch env vars AND compose from Portainer — both are source of truth.
          # The infrastructure compose (networks, OTel config, etc.) lives in the
          # composer repo and is deployed via rake portainer:deploy. Never overwrite
          # it here; doing so strips network config and breaks observability.
          req = urllib.request.Request(f"{PORTAINER}/api/stacks/{STACK_ID}", headers={"X-API-Key": key})
          with urllib.request.urlopen(req, timeout=30) as resp:
              stack = json.load(resp)

          file_req = urllib.request.Request(
              f"{PORTAINER}/api/stacks/{STACK_ID}/file",
              headers={"X-API-Key": key}
          )
          with urllib.request.urlopen(file_req, timeout=30) as resp:
              compose = json.load(resp)["StackFileContent"]

          # Image is already on the host — no pull needed during stack update
          payload = {"stackFileContent": compose, "env": stack["Env"], "pullImage": False}
          req = urllib.request.Request(
              f"{PORTAINER}/api/stacks/{STACK_ID}?endpointId={ENDPOINT_ID}",
              data=json.dumps(payload).encode(),
              headers=headers,
              method="PUT",
          )
          with urllib.request.urlopen(req, timeout=300) as resp:
              result = json.load(resp)
              print(f"Redeployed learn_hanzi stack (status={result['Status']})")
          PYEOF

      - name: Push DORA deploy metrics to Pushgateway
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
        run: |
          [ -z "$PUSHGATEWAY_URL" ] && { echo "PUSHGATEWAY_URL not set -- skipping"; exit 0; }
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          COMMIT_TS="$(git show -s --format=%ct "$GITHUB_SHA")"
          DEPLOY_TS="$(date +%s)"
          printf 'learn_hanzi_deploy_total{outcome="success"} 1\nlearn_hanzi_deploy_timestamp_seconds %s\nlearn_hanzi_commit_timestamp_seconds %s\n' \
            "$DEPLOY_TS" "$COMMIT_TS" \
          | curl --silent --show-error --fail \
              --data-binary @- \
              "${PUSHGATEWAY_URL}/metrics/job/learn_hanzi/instance/${SHORT_SHA}"

  publish-failure-metric:
    name: publish-failure-metric
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && failure()
    needs: [publish]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Push DORA failure metric to Pushgateway
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
        run: |
          [ -z "$PUSHGATEWAY_URL" ] && { echo "PUSHGATEWAY_URL not set -- skipping"; exit 0; }
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          COMMIT_TS="$(git show -s --format=%ct "$GITHUB_SHA")"
          DEPLOY_TS="$(date +%s)"
          printf 'learn_hanzi_deploy_total{outcome="failure"} 1\nlearn_hanzi_deploy_timestamp_seconds %s\nlearn_hanzi_commit_timestamp_seconds %s\n' \
            "$DEPLOY_TS" "$COMMIT_TS" \
          | curl --silent --show-error --fail \
              --data-binary @- \
              "${PUSHGATEWAY_URL}/metrics/job/learn_hanzi/instance/${SHORT_SHA}"
